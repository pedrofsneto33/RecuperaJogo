<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <style>
    @font-face {
      font-family: "Fraunces";
      src: url("og-fonts/Fraunces-latin.woff2") format("woff2"),
           url("og-fonts/Fraunces-VF.ttf") format("truetype");
      font-weight: 600;
      font-style: normal;
      font-display: block;
    }
    @font-face {
      font-family: "Source Sans 3";
      src: url("og-fonts/SourceSans3-latin.woff2") format("woff2"),
           url("og-fonts/SourceSans3-latin-ext.woff2") format("woff2"),
           url("og-fonts/SourceSans3-Medium.ttf") format("truetype");
      font-weight: 500;
      font-style: normal;
      font-display: block;
    }
    html, body {
      margin: 0;
      padding: 0;
      width: 1200px;
      height: 630px;
      background: #F6F3EC;
      overflow: hidden;
    }
    .card {
      position: relative;
      width: 1200px;
      height: 630px;
      overflow: hidden;
      background: #F6F3EC;
    }
    .bg {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center 46%;
    }
    .wash {
      position: absolute;
      inset: 0;
      background:
        linear-gradient(to top, rgba(246, 243, 236, 0.92) 0%, rgba(246, 243, 236, 0.2) 18%, rgba(246, 243, 236, 0) 32%),
        linear-gradient(to bottom, rgba(246, 243, 236, 0.55) 0%, rgba(246, 243, 236, 0) 16%),
        radial-gradient(ellipse 68% 58% at 50% 46%, rgba(246, 243, 236, 0.78) 0%, rgba(246, 243, 236, 0.42) 42%, rgba(246, 243, 236, 0.08) 72%, rgba(246, 243, 236, 0) 100%);
    }
    .lockup {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 72px 160px 88px;
      box-sizing: border-box;
    }
    h1 {
      margin: 0;
      font-family: "Fraunces", Georgia, serif;
      font-optical-sizing: auto;
      font-weight: 600;
      font-size: 92px;
      line-height: 0.95;
      letter-spacing: -0.03em;
      color: #1C2430;
      text-shadow: 0 1px 0 rgba(246, 243, 236, 0.7);
    }
    .rule {
      width: 168px;
      height: 2px;
      margin: 22px 0 18px;
      background: #2F4A42;
      opacity: 0.85;
    }
    p {
      margin: 0;
      max-width: 760px;
      font-family: "Source Sans 3", "Segoe UI", sans-serif;
      font-weight: 500;
      font-size: 28px;
      line-height: 1.3;
      letter-spacing: 0.01em;
      color: #2F4A42;
    }
  </style>
</head>
<body>
  <div class="card">
    <img class="bg" src="og-art.jpg" alt="" />
    <div class="wash"></div>
    <div class="lockup">
      <h1>RecuperaJogo</h1>
      <div class="rule"></div>
      <p>Rascunho de petição para Juizado Especial</p>
    </div>
  </div>
</body>
</html>
